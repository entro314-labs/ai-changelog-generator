name: Test AI Providers

on:
  push:
    branches: [main]
    paths:
      - 'src/infrastructure/providers/**'
      - 'src/infrastructure/config/**'
      - 'src/shared/utils/**'
      - 'test/providers.test.ts'
  pull_request:
    branches: [main]
    paths:
      - 'src/infrastructure/providers/**'
      - 'src/infrastructure/config/**'
      - 'src/shared/utils/**'
      - 'test/providers.test.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Must satisfy the package's `engines.node` (>=24.19.0).
        node-version: ['24.19.0']

    steps:
      - uses: actions/checkout@v6

      # pnpm must exist before setup-node runs, because `cache: 'pnpm'` shells out
      # to pnpm to locate the store. Installing it afterwards fails the job.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Secrets are passed through `env:` rather than interpolated into the script,
      # so a value containing quotes or newlines cannot break out of the command.
      - name: Create .env.local file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEFAULT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEFAULT_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          {
            echo "# OpenAI"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"

            echo "# Azure OpenAI"
            echo "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}"
            echo "AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}"
            echo "AZURE_OPENAI_DEFAULT_DEPLOYMENT=${AZURE_OPENAI_DEFAULT_DEPLOYMENT}"

            echo "# Anthropic"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"

            echo "# Google"
            echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}"

            echo "# Hugging Face"
            echo "HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}"
          } > .env.local

          # Vertex AI only when service-account credentials are configured.
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ]; then
            printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > google-credentials.json
            {
              echo "GOOGLE_APPLICATION_CREDENTIALS=./google-credentials.json"
              echo "VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID}"
              echo "VERTEX_LOCATION=${VERTEX_LOCATION}"
            } >> .env.local
          fi

          # Local providers (Ollama, LM Studio) are skipped in CI.

      # Single named script against the real .ts suite. The previous three steps
      # all ran the same nonexistent `test/providers.test.js`.
      - name: Run provider tests
        run: pnpm run test:providers

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.node-version }}
          path: test/vitest-results/
          retention-days: 7
